<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Animated grid background element -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 48px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #38bdf8;
    }
    .pulse-circle {
      animation: pulse 3s infinite alternate ease-in-out;
    }
    .orbit-particle {
      animation: spin 12s linear infinite;
      transform-origin: 1000px 150px;
    }
    .orbit-particle-2 {
      animation: spin 18s linear infinite reverse;
      transform-origin: 1000px 150px;
    }
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.4; }
      100% { transform: scale(1.08); opacity: 0.8; }
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="300" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="300" rx="16" fill="url(#grid)"/>

  <!-- Dynamic Animated Chemical Nodes in Background (Right side so title is 100% visible) -->
  <g opacity="0.6">
    <!-- Glowing background aura -->
    <circle cx="1000" cy="150" r="120" fill="url(#glowGrad)"/>
    
    <!-- Outer Bond Orbit Ring -->
    <circle cx="1000" cy="150" r="90" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 6" stroke-opacity="0.4"/>
    <circle cx="1000" cy="150" r="50" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.5"/>

    <!-- Dynamic Spinning Atoms & Molecular Bonds -->
    <g class="orbit-particle">
      <line x1="1000" y1="150" x2="1090" y2="150" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.6"/>
      <circle cx="1090" cy="150" r="9" fill="#38bdf8"/>
      <circle cx="1090" cy="150" r="16" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.3"/>
    </g>

    <g class="orbit-particle-2">
      <line x1="1000" y1="150" x2="950" y2="106" stroke="#818cf8" stroke-width="2" stroke-opacity="0.6"/>
      <circle cx="950" cy="106" r="8" fill="#818cf8"/>
      <line x1="1000" y1="150" x2="1035" y2="193" stroke="#c084fc" stroke-width="2" stroke-opacity="0.6"/>
      <circle cx="1035" cy="193" r="10" fill="#c084fc"/>
    </g>

    <!-- Central Benzene Ring Structure -->
    <polygon points="1000,115 1030,132.5 1030,167.5 1000,185 970,167.5 970,132.5" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.8"/>
    <circle cx="1000" cy="150" r="22" fill="none" stroke="#818cf8" stroke-width="2" stroke-opacity="0.6"/>
  </g>

  <!-- Left Side Foreground Text & Branding (Completely unobstructed) -->
  <g transform="translate(60, 0)">
    <!-- Pill Category Badge -->
    <rect x="0" y="52" width="230" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="15" y="73" class="badge-text">🧪 CHEMINFORMATICS &amp; R&amp;D</text>

    <!-- Main Title -->
    <text x="0" y="140" class="title">Awesome Chemical Registration</text>

    <!-- Gradient Accent Line -->
    <rect x="0" y="158" width="480" height="4" rx="2" fill="url(#accentGrad)"/>

    <!-- Subtitle -->
    <text x="0" y="200" class="subtitle">Curated SaaS Platforms &amp; Open-Source Compound Management Tools</text>

    <!-- Feature tags -->
    <g transform="translate(0, 225)">
      <text x="0" y="16" font-family="system-ui, sans-serif" font-size="14" fill="#64748b" font-weight="600">
        🔬 Structure Standardization • 📊 Inventory Management • 🧬 FAIR Bioassay Integration
      </text>
    </g>
  </g>
</svg>
